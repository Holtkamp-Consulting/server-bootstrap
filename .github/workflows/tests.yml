name: Tests

# The maintenance job runs unattended as root on production hosts; its tests
# must gate every change instead of depending on someone running them locally.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck maintenance scripts
        run: shellcheck -S warning -e SC1090 maintenance-redeploy.sh maintenance-update.sh notify-failure.sh
      - name: Run tests
        run: |
          rc=0
          for t in tests/*_test.sh; do
            bash "$t" || { echo "::error file=$t::$t failed"; rc=1; }
          done
          exit "$rc"
