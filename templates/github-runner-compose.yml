# Template für einen selbst-gehosteten GitHub Actions Runner als Portainer-Stack.
#
# Setup:
#   1. Neues GitHub-Repo "github-runner" in der Org anlegen, diese Datei als
#      docker-compose.yml einchecken.
#   2. Infisical-Projekt "github-runner" anlegen und die unten aufgeführten
#      Secrets hinterlegen.
#   3. Den Stack via install.sh deployen — er wird automatisch gefunden,
#      weil Repo-Name == Infisical-Projektname.
#
# Credentials-Quellen:
#   /etc/infisical-deploy.env (gemountet, 640 root:docker)
#     enthält die Machine Identity Credentials und kann daher nicht selbst
#     aus Infisical gelesen werden — diese Credentials sind der Zugang zu
#     Infisical.
#
#   Infisical-Projekt "github-runner" (runner-spezifische Secrets):
#     APP_ID                GitHub App ID
#     APP_PRIVATE_KEY       GitHub App Private Key im PEM-Format
#     APP_LOGIN             GitHub App/Login-Kontext, z.B. Org-Name
#     RUNNER_NAME           Eindeutiger Runner-Name, z.B. prod-runner
#     RUNNER_LABELS         Komma-getrennte Labels, z.B. portainer,prod

services:
  runner:
    image: myoung34/github-runner:latest
    restart: always
    network_mode: host
    environment:
      RUNNER_SCOPE: org
      ORG_NAME: Holtkamp-Consulting
      APP_ID: ${APP_ID}
      APP_PRIVATE_KEY: ${APP_PRIVATE_KEY}
      APP_LOGIN: ${APP_LOGIN}
      LABELS: ${RUNNER_LABELS}
      RUNNER_NAME: ${RUNNER_NAME}
      ADDITIONAL_PACKAGES: jq
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/infisical-deploy.env:/etc/infisical-deploy.env:ro
      - /opt/deploy:/opt/deploy:ro
